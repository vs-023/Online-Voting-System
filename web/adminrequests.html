<!DOCTYPE html>
<html>
<head>

    <title>Admin Requests</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
        }

        .navbar{

            background:#1e3c72;

            color:white;

            padding:20px;

            text-align:center;

            font-size:32px;

            font-weight:bold;
        }

        .container{

            width:85%;

            margin:40px auto;

            background:white;

            padding:30px;

            border-radius:12px;

            box-shadow:0px 0px 10px gray;
        }

        h2{

            color:#1e3c72;

            text-align:center;

            margin-bottom:30px;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        table th{

            background:#1e3c72;

            color:white;

            padding:15px;
        }

        table td{

            padding:15px;

            text-align:center;

            border-bottom:1px solid #ddd;
        }

        .approve{

            background:green;

            color:white;

            padding:8px 16px;

            border:none;

            border-radius:5px;

            cursor:pointer;
        }

        .approve:hover{

            background:darkgreen;
        }

    </style>

</head>

<body>

<div class="navbar">

    ADMIN PANEL

</div>

<div class="container">

    <h2>Correction Requests</h2>

    <table>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Request</th>

            <th>Status</th>

            <th>Action</th>

        </tr>

        <!-- DATA WILL COME FROM SERVLET -->

    </table>

</div>

</body>
</html>
