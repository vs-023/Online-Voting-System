<!DOCTYPE html>
<html>
<head>

<title>Manage Candidates</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
}

.container{

    width:500px;

    margin:50px auto;

    background:white;

    padding:40px;

    border-radius:12px;

    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

h2{

    text-align:center;

    color:#1e3c72;

    margin-bottom:25px;
}

input{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:16px;
}

input:focus{

    outline:none;

    border:1px solid #1e3c72;
}

button{

    width:100%;

    padding:14px;

    background:#1e3c72;

    color:white;

    border:none;

    border-radius:6px;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#16325c;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Candidate</h2>

<form action="CandidateServlet" method="post">

<input type="text"
       name="candidate"
       placeholder="Candidate Name"
       required>

<input type="text"
       name="party"
       placeholder="Party Name"
       required>

<input type="number"
       name="age"
       placeholder="Candidate Age"
       min="18"
       required>

<button type="submit">

Add Candidate

</button>

</form>

</div>

</body>
</html>
