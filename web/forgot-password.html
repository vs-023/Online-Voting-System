<!DOCTYPE html>
<html>
<head>

    <title>Forgot Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),
            url("img/vote.png");

            background-size:cover;
            background-position:center;
        }

        .container{

            width:420px;

            background:white;

            padding:35px;

            border-radius:15px;

            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        h2{

            text-align:center;

            color:#1e3c72;

            margin-bottom:25px;
        }

        label{

            font-weight:bold;

            color:#333;
        }

        input{

            width:100%;

            padding:12px;

            margin-top:8px;

            margin-bottom:18px;

            border:1px solid #ccc;

            border-radius:8px;

            transition:0.3s;
        }

        input:focus{

            outline:none;

            border-color:#1e3c72;

            box-shadow:0px 0px 8px rgba(30,60,114,0.3);
        }

        button{

            width:100%;

            padding:14px;

            background:#1e3c72;

            color:white;

            border:none;

            border-radius:8px;

            font-size:17px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#16325c;
        }

        .msg{

            background:#e7f3ff;

            color:#1e3c72;

            padding:12px;

            border-radius:8px;

            margin-bottom:15px;

            text-align:center;
        }

        .error{

            display:none;

            background:#ffe5e5;

            color:red;

            padding:12px;

            border-radius:8px;

            margin-bottom:15px;

            text-align:center;

            font-weight:bold;
        }

        .back{

            margin-top:20px;

            text-align:center;
        }

        .back a{

            text-decoration:none;

            color:#1e3c72;

            font-weight:bold;
        }

        .back a:hover{

            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <div class="msg">

        Enter registered email and mobile number to receive OTP.

    </div>

    <div class="error" id="errorBox"></div>

    <form action="ForgotPasswordServlet"
          method="post">

        <label>Email</label>

        <input type="email"
               name="email"
               required>

        <label>Mobile Number</label>

        <input type="text"
               name="mobile"
               pattern="[0-9]{10}"
               maxlength="10"
               required>

        <button type="submit">

            Send OTP

        </button>

    </form>

    <div class="back">

        <a href="login.html">

            Back To Login

        </a>

    </div>

</div>

<script>

    const params =
        new URLSearchParams(window.location.search);

    const errorBox =
        document.getElementById("errorBox");

    if(params.get("error") === "1"){

        errorBox.style.display = "block";

        errorBox.innerText =
            "Invalid email or mobile number.";
    }

</script>

</body>
</html>
