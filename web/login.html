<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Online Voting System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),
            url("img/vote.png");
            background-size:cover;
            background-position:center;
        }

        /* ✅ HOME BUTTON (ADDED ONLY THIS) */
        .home-btn{
            position:fixed;
            top:20px;
            right:20px;
            background:#1e3c72;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            text-decoration:none;
            font-size:14px;
            font-weight:bold;
            transition:0.3s;
            z-index:1000;
        }

        .home-btn:hover{
            background:#16325c;
        }

        .container{
            width:420px;
            background:rgba(255,255,255,0.97);
            padding:35px;
            border-radius:16px;
            box-shadow:0px 15px 40px rgba(0,0,0,0.4);
            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{
            from{
                transform:translateY(20px);
                opacity:0;
            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:20px;
            font-size:32px;
        }

        .top-error{
            display:none;
            padding:12px;
            margin-bottom:15px;
            border-radius:8px;
            text-align:center;
            font-size:14px;
            font-weight:bold;
        }

        .error{
            background:#ffe5e5;
            color:red;
        }

        .success{
            background:#e6ffed;
            color:green;
        }

        label{
            color:#333;
            font-size:14px;
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:12px;
            margin-top:6px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            border-color:#1e3c72;
            outline:none;
            box-shadow:0 0 6px rgba(30,60,114,0.3);
        }

        button{
            width:100%;
            padding:13px;
            background:#1e3c72;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#16325c;
            transform:translateY(-2px);
        }

        .register{
            text-align:center;
            margin-top:18px;
            font-size:14px;
        }

        .register a{
            color:#1e3c72;
            text-decoration:none;
            font-weight:bold;
        }

        .register a:hover{
            text-decoration:underline;
        }

        .forgot{
            text-align:center;
            margin-top:12px;
        }

        .forgot a{
            color:#cc0000;
            text-decoration:none;
            font-weight:bold;
            font-size:14px;
        }

        .forgot a:hover{
            text-decoration:underline;
        }

        .hint{
            font-size:12px;
            color:#777;
            margin-top:-12px;
            margin-bottom:12px;
        }
    </style>
</head>

<body>

<!-- ✅ HOME BUTTON ADDED -->
<a href="home.html" class="home-btn">Home</a>

<div class="container">

    <h2>Login</h2>

    <div class="top-error" id="topError"></div>

    <form action="LoginServlet"
          method="post"
          onsubmit="return validateForm()">

        <label>User Type</label>

        <select name="usertype" required>

            <option value="">Select</option>

            <option value="admin">Admin</option>

            <option value="voter">Voter</option>

        </select>

        <label>Email / Username</label>

        <input type="text"
               name="email"
               placeholder="Enter Email (Voter) or Username (Admin)"
               required>

        <label>Password</label>

        <input type="password"
               id="password"
               name="password"
               required>

        <div class="hint">
            Enter your account password
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">
        Not registered?
        <a href="register.html">Create an account</a>
    </div>

    <div class="forgot">
        <a href="forgot-password.html">Forgot Password?</a>
    </div>

</div>

<script>

function validateForm(){

    const pass =
        document.getElementById("password").value;

    if(pass.trim() === ""){

        showError("Password cannot be empty");

        return false;
    }

    return true;
}

const params =
    new URLSearchParams(window.location.search);

const errorBox =
    document.getElementById("topError");

if(params.get("error") === "1"){

    errorBox.style.display = "block";
    errorBox.classList.add("error");
    errorBox.innerText = "Incorrect email or password";
}

if(params.get("error") === "2"){

    errorBox.style.display = "block";
    errorBox.classList.add("error");
    errorBox.innerText = "Login failed. Please try again";
}

if(params.get("logout") === "1"){

    errorBox.style.display = "block";
    errorBox.classList.add("success");
    errorBox.innerText = "Logged out successfully";
}

function showError(msg){

    errorBox.style.display = "block";
    errorBox.classList.add("error");
    errorBox.innerText = msg;
}

</script>

</body>
</html>
