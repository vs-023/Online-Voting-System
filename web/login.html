<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
    ),
    url("img/vote.png");

    background-size:cover;

    background-position:center;
}


/* HOME BUTTON */

.home-btn{

    position:fixed;

    top:20px;

    right:20px;

    background:#1e3c72;

    color:white;

    padding:10px 18px;

    border-radius:8px;

    text-decoration:none;

    font-size:14px;

    font-weight:bold;

    transition:0.3s;

    z-index:1000;
}


.home-btn:hover{

    background:#16325c;
}


/* CONTAINER */

.container{

    width:420px;

    background:rgba(255,255,255,0.97);

    padding:35px;

    border-radius:16px;

    box-shadow:
        0px 15px 40px
        rgba(0,0,0,0.4);

    animation:fadeIn 0.6s ease;
}


@keyframes fadeIn{

    from{

        transform:translateY(20px);

        opacity:0;
    }

    to{

        transform:translateY(0);

        opacity:1;
    }
}


h2{

    text-align:center;

    color:#1e3c72;

    margin-bottom:20px;

    font-size:32px;
}


/* MESSAGE */

.top-error{

    display:none;

    padding:12px;

    margin-bottom:15px;

    border-radius:8px;

    text-align:center;

    font-size:14px;

    font-weight:bold;
}


.error{

    background:#ffe5e5;

    color:red;
}


.success{

    background:#e6ffed;

    color:green;
}


/* LABELS */

label{

    color:#333;

    font-size:14px;

    font-weight:bold;
}


/* INPUT */

input,
select{

    width:100%;

    padding:12px;

    margin-top:6px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:8px;

    transition:0.3s;
}


input:focus,
select:focus{

    border-color:#1e3c72;

    outline:none;

    box-shadow:
        0 0 6px
        rgba(30,60,114,0.3);
}


/* BUTTON */

button{

    width:100%;

    padding:13px;

    background:#1e3c72;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;
}


button:hover{

    background:#16325c;

    transform:translateY(-2px);
}


/* REGISTER */

.register{

    text-align:center;

    margin-top:18px;

    font-size:14px;
}


.register a{

    color:#1e3c72;

    text-decoration:none;

    font-weight:bold;
}


.register a:hover{

    text-decoration:underline;
}


/* FORGOT */

.forgot{

    text-align:center;

    margin-top:12px;
}


.forgot a{

    color:#cc0000;

    text-decoration:none;

    font-weight:bold;

    font-size:14px;
}


.forgot a:hover{

    text-decoration:underline;
}


/* HINT */

.hint{

    font-size:12px;

    color:#777;

    margin-top:-12px;

    margin-bottom:12px;
}

</style>

</head>


<body>


<!-- HOME -->

<a href="home.html" class="home-btn">

    Home

</a>



<div class="container">


<h2>

    Login

</h2>



<div class="top-error" id="topError"></div>



<form
    action="LoginServlet"
    method="post"
    onsubmit="return validateForm()"
>


    <!-- USER TYPE -->

    <label>

        User Type

    </label>


    <select
        name="usertype"
        id="usertype"
        required
        onchange="changeLoginType()"
    >

        <option value="">

            Select

        </option>


        <option value="admin">

            Admin

        </option>


        <option value="voter">

            Voter

        </option>

    </select>



    <!-- USERNAME / EMAIL -->

    <label id="emailLabel">

        Email / Username

    </label>


    <input
        type="text"
        name="email"
        id="email"
        placeholder="Enter Email or Username"
        required
    >



    <!-- PASSWORD -->

    <label>

        Password

    </label>


    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter Password"
        required
    >


    <div class="hint">

        Enter your account password

    </div>



    <!-- LOGIN -->

    <button type="submit">

        Login

    </button>


</form>



<!-- VOTER REGISTRATION ONLY -->

<div
    class="register"
    id="registerSection"
>

    Not registered?

    <a href="register.html">

        Create Voter Account

    </a>

</div>



<!-- FORGOT PASSWORD -->

<div class="forgot">

    <a href="forgot-password.html">

        Forgot Password?

    </a>

</div>


</div>



<script>


function changeLoginType(){

    var type =
        document.getElementById("usertype").value;


    var email =
        document.getElementById("email");


    var label =
        document.getElementById("emailLabel");


    var register =
        document.getElementById("registerSection");


    if(type === "admin"){

        label.innerHTML =
            "Admin Username";


        email.placeholder =
            "Enter Admin Username";


        /*
         * IMPORTANT:
         * Admin registration is NOT available.
         */

        register.innerHTML =
            "Admin accounts are pre-registered.";

    }


    else if(type === "voter"){

        label.innerHTML =
            "Voter Email";


        email.placeholder =
            "Enter your registered email";


        register.innerHTML =
            'Not registered? ' +
            '<a href="register.html">' +
            'Create Voter Account' +
            '</a>';

    }


    else{

        label.innerHTML =
            "Email / Username";


        email.placeholder =
            "Enter Email or Username";


        register.innerHTML =
            'Not registered? ' +
            '<a href="register.html">' +
            'Create Voter Account' +
            '</a>';

    }

}



function validateForm(){

    var type =
        document.getElementById("usertype").value;


    var email =
        document.getElementById("email").value.trim();


    var password =
        document.getElementById("password").value.trim();


    var error =
        document.getElementById("topError");


    error.style.display = "none";


    if(type === ""){

        error.innerHTML =
            "Please select User Type.";

        error.className =
            "top-error error";

        error.style.display =
            "block";

        return false;
    }


    if(email === ""){

        error.innerHTML =
            "Please enter your email or username.";

        error.className =
            "top-error error";

        error.style.display =
            "block";

        return false;
    }


    if(password === ""){

        error.innerHTML =
            "Please enter your password.";

        error.className =
            "top-error error";

        error.style.display =
            "block";

        return false;
    }


    return true;

}

</script>


</body>

</html>
