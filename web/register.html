<!DOCTYPE html>
<html>

<head>

    <title>Register - Online Voting System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(rgba(0,0,0,0.65),
            rgba(0,0,0,0.65)),
            url("img/slide2.png");

            background-size:cover;
            background-position:center;

            padding:40px 0;
        }

        /* ✅ HOME BUTTON ADDED ONLY */
        .home-btn{
            position:fixed;
            top:20px;
            right:20px;
            background:#1e3c72;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            text-decoration:none;
            font-size:14px;
            font-weight:bold;
            transition:0.3s;
            z-index:1000;
        }

        .home-btn:hover{
            background:#16325c;
        }

        .container{

            width:900px;

            background:rgba(255,255,255,0.96);

            border-radius:18px;

            padding:40px;

            box-shadow:0px 0px 25px rgba(0,0,0,0.4);
        }

        .title{

            text-align:center;

            margin-bottom:35px;
        }

        .title h1{

            color:#1e3c72;

            font-size:42px;

            margin-bottom:10px;
        }

        .title p{

            color:#555;

            font-size:18px;
        }

        form{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:22px;
        }

        .input-box{

            display:flex;

            flex-direction:column;
        }

        .input-box label{

            margin-bottom:8px;

            color:#1e3c72;

            font-weight:bold;

            font-size:15px;
        }

        .input-box input,
        .input-box select,
        .input-box textarea{

            padding:14px;

            border:1px solid #ccc;

            border-radius:8px;

            font-size:15px;
        }

        .input-box input:focus,
        .input-box select:focus,
        .input-box textarea:focus{

            outline:none;

            border-color:#1e3c72;

            box-shadow:0px 0px 8px rgba(30,60,114,0.3);
        }

        textarea{

            resize:none;
            height:90px;
        }

        .full{

            grid-column:1/3;
        }

        .password-note{

            font-size:13px;

            color:#777;

            margin-top:5px;

            line-height:1.5;
        }

        .btn{

            width:100%;

            padding:15px;

            background:#1e3c72;

            color:white;

            border:none;

            border-radius:8px;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .btn:hover{

            background:#16325c;
        }

        .error-box{

            background:#ffe5e5;

            color:red;

            padding:12px;

            border-radius:8px;

            margin-bottom:20px;

            text-align:center;

            display:none;

            font-weight:bold;
        }

        .success-box{

            background:#e8fff0;

            color:green;

            padding:12px;

            border-radius:8px;

            margin-bottom:20px;

            text-align:center;

            display:none;

            font-weight:bold;
        }

        .login-link{

            text-align:center;

            margin-top:25px;

            font-size:17px;
        }

        .login-link a{

            color:#1e3c72;

            text-decoration:none;

            font-weight:bold;
        }

        .login-link a:hover{

            text-decoration:underline;
        }

        @media(max-width:900px){

            .container{

                width:95%;
                padding:30px;
            }

            form{

                grid-template-columns:1fr;
            }

            .full{

                grid-column:1/2;
            }
        }
        /* CENTER OTP DROPDOWN BOX */
    .otp-center-box{
        grid-column: 1 / 3;   /* spans full width */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 10px 0;
    }

        /* LABEL CENTER */
    .otp-center-box label{
        font-weight: bold;
        color: #1e3c72;
        margin-bottom: 10px;
        font-size: 16px;
    }

        /* DROPDOWN DESIGN */
    .otp-select {
        width: 60%;
        min-width: 280px;
        padding: 16px;
        font-size: 16px;
        border-radius: 10px;
        border: 2px solid #1e3c72;
        background: white;
        color: #1e3c72;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: 0.3s;
    }

        /* HOVER EFFECT */
    .otp-select:hover {
        box-shadow: 0px 0px 12px rgba(30, 60, 114, 0.3);
        transform: scale(1.03);
    }

        /* FOCUS EFFECT */
    .otp-select:focus {
        outline: none;
        border-color: #16325c;
        box-shadow: 0px 0px 15px rgba(22, 50, 92, 0.4);
    }
    </style>

</head>

<body>

<!-- ✅ HOME BUTTON ADDED -->
<a href="home.html" class="home-btn">Home</a>

<div class="container">

    <div class="title">

        <h1>Voter Registration</h1>

        <p>Create your secure voter account</p>

    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <form action="RegisterServlet"
          method="post"
          id="registerForm">

        <div class="input-box">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="input-box">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-box">
            <label>Mobile</label>
            <input type="text" name="mobile" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date" name="dob" required>
        </div>

        <div class="input-box">
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="input-box">
            <label>Voter ID</label>
            <input type="text" name="voterid" required>
        </div>

        <div class="input-box">
            <label>Aadhaar</label>
            <input type="text" name="aadhaar" pattern="[0-9]{12}" maxlength="12" required>
        </div>

        <div class="input-box full">
            <label>Address</label>
            <textarea name="address" required></textarea>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </div>

        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmpassword" minlength="8" required>
        </div>
        
        <div class="otp-center-box">

    <label>Choose OTP Verification Method</label>

    <select name="otpMethod" required class="otp-select">

        <option value="">Select OTP Method</option>
        <option value="email"> Email OTP</option>
        <option value="sms"> SMS OTP</option>

    </select>

</div>

        <div class="full">
            <button type="submit" class="btn">Register Account</button>
        </div>
        

    </form>

    <div class="login-link">
        Already Registered?
        <a href="login.html">Login Here</a>
    </div>

</div>

<script>
const form = document.getElementById("registerForm");
const errorBox = document.getElementById("errorBox");

form.addEventListener("submit", function(e){
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){
        e.preventDefault();
        errorBox.style.display = "block";
        errorBox.innerText = "Passwords do not match";
    }
});

const params = new URLSearchParams(window.location.search);
const successBox = document.getElementById("successBox");

if(params.get("success") === "1"){
    successBox.style.display = "block";
    successBox.innerText = "Registration successful. Please login.";
}

if(params.get("error") === "1"){
    errorBox.style.display = "block";
    errorBox.innerText = "Email or Aadhaar already exists.";
}
</script>

</body>
</html>
