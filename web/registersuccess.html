<!DOCTYPE html>
<html>

<head>

    <title>Registration Successful</title>

    <!-- AUTO REDIRECT -->
    <meta http-equiv="refresh" content="4;url=login.html">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(135deg,
            #1e3c72,
            #2a5298,
            #00c6ff);

            background-size:300% 300%;

            animation:bgMove 8s ease infinite;
        }

        @keyframes bgMove{

            0%{ background-position:0% 50%; }
            50%{ background-position:100% 50%; }
            100%{ background-position:0% 50%; }
        }

        .card{

            width:430px;

            background:rgba(255,255,255,0.96);

            padding:40px;

            border-radius:18px;

            text-align:center;

            box-shadow:0px 20px 50px rgba(0,0,0,0.35);

            animation:pop 0.6s ease;
        }

        @keyframes pop{
            from{ transform:scale(0.8); opacity:0; }
            to{ transform:scale(1); opacity:1; }
        }

        .icon{
            font-size:70px;
            color:#28a745;
            margin-bottom:15px;
        }

        h1{
            color:#1e3c72;
            margin-bottom:15px;
            font-size:36px;
        }

        p{
            color:#555;
            font-size:16px;
            line-height:1.7;
        }

        .loader{
            width:120px;
            height:5px;
            background:#ddd;
            margin:25px auto;
            border-radius:10px;
            overflow:hidden;
        }

        .bar{
            height:100%;
            width:0%;
            background:#28a745;
            animation:load 4s linear forwards;
        }

        @keyframes load{
            from{ width:0%; }
            to{ width:100%; }
        }

        .btn{
            display:inline-block;
            margin-top:10px;
            padding:13px 28px;
            background:#1e3c72;
            color:white;
            text-decoration:none;
            border-radius:30px;
            font-size:16px;
            transition:0.3s;
        }

        .btn:hover{
            background:#16325c;
            transform:translateY(-2px);
        }

        .small{
            margin-top:18px;
            color:#777;
            font-size:13px;
        }

    </style>

</head>

<body>

<div class="card" id="card">

    <div class="icon">✔</div>

    <h1>Registration Successful</h1>

    <p>
        Your voter account has been created successfully.
        <br>
        You are now eligible to participate in elections.
    </p>

    <!-- LOADER -->
    <div class="loader">
        <div class="bar"></div>
    </div>

    <a href="login.html" class="btn">Go To Login</a>

    <div class="small">
        Redirecting automatically in 4 seconds...
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const card = document.getElementById("card");

    // IF OTP VERIFIED
    if(params.get("verified") === "1"){

        card.innerHTML = `
            <div class="icon">✔</div>

            <h1>Registration & OTP Verified</h1>

            <p>
                Your account has been successfully verified through OTP.
                <br>
                You can now login and vote securely.
            </p>

            <div class="loader">
                <div class="bar"></div>
            </div>

            <a href="login.html" class="btn">Go To Login</a>

            <div class="small">
                Redirecting automatically in 4 seconds...
            </div>
        `;
    }
</script>

</body>

</html>
