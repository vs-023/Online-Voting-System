<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),
            url("img/slide2.png");
            background-size:cover;
            background-position:center;
        }

        .container{
            width:430px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:20px;
        }

        .info{
            background:#e7f3ff;
            color:#1e3c72;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;
            font-size:15px;
        }

        .error{
            display:none;
            background:#ffe5e5;
            color:red;
            padding:12px;
            border-radius:8px;
            margin-bottom:18px;
            text-align:center;
            font-weight:bold;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        input:focus{
            outline:none;
            border-color:#1e3c72;
            box-shadow:0px 0px 8px rgba(30,60,114,0.3);
        }

        button{
            width:100%;
            padding:14px;
            background:#1e3c72;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#16325c;
        }

        .back{
            margin-top:18px;
            text-align:center;
        }

        .back a{
            text-decoration:none;
            color:#1e3c72;
            font-weight:bold;
        }

        .back a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <div class="info">
        Create a new secure password for your account.
    </div>

    <!-- ERROR BOX -->
    <div class="error" id="errorBox"></div>

    <!-- IMPORTANT FIXED FIELD NAMES -->
    <form action="ResetPasswordServlet"
          method="post"
          onsubmit="return validatePasswords()">

        <label>New Password</label>
        <input type="password"
               id="password"
               name="newpassword"
               minlength="8"
               required>

        <label>Confirm Password</label>
        <input type="password"
               id="confirmPassword"
               name="confirmpassword"
               required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div class="back">
        <a href="login.html">Back To Login</a>
    </div>

</div>

<script>

    function validatePasswords(){

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const errorBox =
            document.getElementById("errorBox");

        if(password !== confirmPassword){

            errorBox.style.display = "block";
            errorBox.innerText = "Passwords do not match.";

            return false;
        }

        return true;
    }

    // SHOW SERVER ERRORS
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById("errorBox");

    if(params.get("error") === "1"){
        errorBox.style.display = "block";
        errorBox.innerText = "Passwords do not match.";
    }

    if(params.get("error") === "2"){
        errorBox.style.display = "block";
        errorBox.innerText = "Password must be at least 8 characters.";
    }

    if(params.get("error") === "3"){
        errorBox.style.display = "block";
        errorBox.innerText = "Failed to update password. Try again.";
    }

</script>

</body>

</html>
