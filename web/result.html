<!DOCTYPE html>
<html>
<head>

    <title>Election Results</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f4f4;
        }

        .navbar{

            background:#1e3c72;

            color:white;

            padding:20px 40px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logout-btn{

            background:#cc0000;

            color:white;

            padding:10px 20px;

            text-decoration:none;

            border-radius:6px;
        }

        .container{

            width:70%;

            margin:50px auto;

            background:white;

            padding:40px;

            border-radius:12px;

            box-shadow:0px 0px 10px gray;
        }

        h1{

            text-align:center;

            color:#1e3c72;

            margin-bottom:40px;
        }

        .result-box{

            background:#e9f0ff;

            padding:20px;

            margin-bottom:20px;

            border-left:8px solid #1e3c72;

            border-radius:8px;

            font-size:22px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Election Results</h2>

    <a href="LogoutServlet" class="logout-btn">

        Logout

    </a>

</div>

<div class="container">

    <h1>Voting Results</h1>

    <div class="result-box">

        Candidate A : 120 Votes

    </div>

    <div class="result-box">

        Candidate B : 95 Votes

    </div>

    <div class="result-box">

        Candidate C : 60 Votes

    </div>

</div>

</body>
</html>
