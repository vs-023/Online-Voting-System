<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Online Voting System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),
            url("img/vote.png");
            background-size:cover;
            background-position:center;
        }

        .box{
            width:380px;
            background:rgba(255,255,255,0.97);
            padding:35px;
            border-radius:16px;
            text-align:center;
            box-shadow:0px 15px 40px rgba(0,0,0,0.4);
        }

        h2{
            color:#1e3c72;
            margin-bottom:10px;
        }

        .timer{
            font-size:14px;
            color:#cc0000;
            margin-bottom:15px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            text-align:center;
            letter-spacing:4px;
        }

        button{
            width:100%;
            padding:12px;
            background:#1e3c72;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#16325c;
        }

        .error{
            color:red;
            margin-bottom:10px;
            font-size:14px;
        }

        .note{
            margin-top:10px;
            font-size:12px;
            color:#777;
        }

        .resend{
            margin-top:12px;
            font-size:13px;
        }

        .resend button{
            background:#28a745;
            margin-top:8px;
        }

        .resend button:disabled{
            background:gray;
            cursor:not-allowed;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>OTP Verification</h2>

    <!-- TIMER -->
    <div class="timer" id="timer">
        OTP expires in: 02:00
    </div>

    <!-- ERROR -->
    <div class="error" id="errorBox"></div>

    <form action="VerifyOtpServlet" method="post">

        <input type="text" name="otp" required>

        <button type="submit">Verify OTP</button>

    </form>

    <!-- RESEND -->
    <div class="resend">
        Didn't receive OTP?

        <br>

        <button id="resendBtn" onclick="resendOtp()" disabled>
            Resend OTP
        </button>
    </div>

    <div class="note">
        Enter the OTP sent to your Email / Mobile
    </div>

</div>

<script>
    // =========================
    // ERROR HANDLING
    // =========================
    const params = new URLSearchParams(window.location.search);

    if(params.get("error") === "1"){
        document.getElementById("errorBox").innerText =
            "Invalid OTP. Please try again.";
    }

    if(params.get("error") === "expired"){
        document.getElementById("errorBox").innerText =
            "OTP expired. Please resend OTP.";
    }

    if(params.get("error") === "session"){
        document.getElementById("errorBox").innerText =
            "Session expired. Please register again.";
    }

    if(params.get("attempts")){
        document.getElementById("errorBox").innerText =
            "Attempt " + params.get("attempts") + " of 3";
    }

    // =========================
    // TIMER (2 MINUTES)
    // =========================
    let timeLeft = 120;

    const timer = document.getElementById("timer");

    let countdown = setInterval(() => {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        timer.innerText =
            "OTP expires in: " +
            (minutes < 10 ? "0" + minutes : minutes) + ":" +
            (seconds < 10 ? "0" + seconds : seconds);

        timeLeft--;

        if(timeLeft < 0){
            clearInterval(countdown);
            timer.innerText = "OTP EXPIRED";

            document.getElementById("errorBox").innerText =
                "OTP expired. Please resend OTP.";

            document.getElementById("resendBtn").disabled = false;
        }

    }, 1000);

    // =========================
    // RESEND OTP
    // =========================
    let resendDelay = 30;
    let resendBtn = document.getElementById("resendBtn");

    let resendTimer = setInterval(() => {

        if(resendDelay > 0){
            resendBtn.innerText = "Resend OTP (" + resendDelay + ")";
            resendDelay--;
        } else {
            resendBtn.innerText = "Resend OTP";
            resendBtn.disabled = false;
            clearInterval(resendTimer);
        }

    }, 1000);

    function resendOtp(){
        window.location.href = "SendOtpServlet";
    }
</script>

</body>
</html>
