<!DOCTYPE html>
<html>
<head>

    <title>Vote Submitted Successfully</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
            rgba(0,0,0,0.65),
            rgba(0,0,0,0.65)
            ),

            url("img/votingbg.jpg");

            background-size:cover;
            background-position:center;
        }

        .success-box{

            width:700px;

            background:rgba(255,255,255,0.95);

            padding:60px;

            border-radius:20px;

            text-align:center;

            box-shadow:0px 0px 25px rgba(0,0,0,0.4);

            animation:popup 0.5s ease;
        }

        @keyframes popup{

            from{
                transform:scale(0.7);
                opacity:0;
            }

            to{
                transform:scale(1);
                opacity:1;
            }
        }

        .tick{

            width:120px;
            height:120px;

            background:#28a745;

            color:white;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            margin:auto;

            font-size:60px;

            margin-bottom:30px;

            box-shadow:0px 0px 15px rgba(40,167,69,0.5);
        }

        h1{

            color:#28a745;

            font-size:52px;

            margin-bottom:20px;
        }

        .message{

            font-size:24px;

            color:#444;

            line-height:1.8;

            margin-bottom:35px;
        }

        .warning{

            background:#fff3cd;

            color:#856404;

            border:1px solid #ffeeba;

            padding:18px;

            border-radius:10px;

            font-size:18px;

            margin-bottom:35px;
        }

        .buttons{

            display:flex;

            justify-content:center;

            gap:20px;

            flex-wrap:wrap;
        }

        .btn{

            text-decoration:none;

            padding:15px 35px;

            border-radius:10px;

            font-size:20px;

            transition:0.3s;

            font-weight:bold;
        }

        .home-btn{

            background:#1e3c72;

            color:white;
        }

        .home-btn:hover{

            background:#16325c;
        }

        .logout-btn{

            background:#cc0000;

            color:white;
        }

        .logout-btn:hover{

            background:#990000;
        }

        .footer{

            margin-top:35px;

            color:gray;

            font-size:16px;
        }

    </style>

</head>

<body>

<div class="success-box">

    <div class="tick">


    </div>

    <h1>

        Vote Submitted

    </h1>

    <div class="message">

        Thank you for participating in the election.<br>

        Your vote has been securely recorded successfully.

    </div>

    <div class="warning">

        You have successfully completed the voting process.
        Multiple voting is not allowed.

    </div>

    <div class="buttons">

        <a href="home.html" class="btn home-btn">

            Go To Home

        </a>

        <a href="LogoutServlet" class="btn logout-btn">

            Logout

        </a>

    </div>

    <div class="footer">

        Online Voting System | Secure Digital Election Portal

    </div>

</div>

</body>
</html>
